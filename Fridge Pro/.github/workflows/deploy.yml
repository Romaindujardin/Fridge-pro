name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  BACKEND_APP_NAME: ${{ secrets.BACKEND_APP_NAME }}
  FRONTEND_APP_NAME: ${{ secrets.FRONTEND_APP_NAME }}

jobs:
  # Test Backend
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run linting
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Build
        working-directory: ./backend
        run: npm run build

  # Test Frontend
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: ./frontend
        run: npm run build

  # Build and Push Docker Images
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push backend image
        working-directory: ./backend
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }} .
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/backend:latest .
          docker push ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/backend:latest

      - name: Build and push frontend image
        working-directory: ./frontend
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }} .
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/frontend:latest .
          docker push ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/frontend:latest

  # Deploy to Azure
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run database migrations
        run: |
          # Install Azure CLI PostgreSQL extension
          az extension add --name rdbms-connect --upgrade
          
          # Note: In production, you would run migrations through a job or init container
          echo "Database migrations should be run manually or through init containers"

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.BACKEND_APP_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/backend:${{ github.sha }}

      - name: Deploy frontend to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.FRONTEND_APP_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}

      - name: Health check
        run: |
          echo "Waiting for services to be ready..."
          sleep 30
          
          BACKEND_URL="https://${{ env.BACKEND_APP_NAME }}.azurewebsites.net"
          FRONTEND_URL="https://${{ env.FRONTEND_APP_NAME }}.azurewebsites.net"
          
          echo "Checking backend health..."
          curl -f "${BACKEND_URL}/api/health" || exit 1
          
          echo "Checking frontend health..."
          curl -f "${FRONTEND_URL}/health" || exit 1
          
          echo "✅ Deployment successful!"
          echo "Frontend: ${FRONTEND_URL}"
          echo "Backend: ${BACKEND_URL}"

      - name: Logout from Azure
        run: az logout
        if: always()
