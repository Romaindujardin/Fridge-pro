name: Deploy Frontend to Azure

on:
  push:
    branches: [ main, azureP ]
    paths:
      - 'Fridge Pro/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      working-directory: ./Fridge Pro/frontend
      run: npm ci
    
    - name: Build
      working-directory: ./Fridge Pro/frontend
      env:
        VITE_API_URL: https://fridge-pro-api-rcabo0.azurewebsites.net
      run: npm run build
    
    - name: Create deployment package
      working-directory: ./Fridge Pro/frontend
      run: |
        mkdir deploy_front
        cp -r dist server.js package.json package-lock.json deploy_front/
        cd deploy_front
        npm install --omit=dev
        zip -r ../frontend.zip .
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: fridge-pro-web-rcabo0
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
        package: ./Fridge Pro/frontend/frontend.zip
